name: cuestionarios-a
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      m1_PASSWORD: ${m1_PASSWORD:?Defina m1_PASSWORD}
      m2_PASSWORD: ${m2_PASSWORD:?Defina m2_PASSWORD}
    ports: ["127.0.0.1:5541:5432"]
    volumes:
      - a-postgres:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]
  m1: &service
    build: ./api
    environment:
      SERVICE_NAME: m1
      DATABASE_URL: postgres://m1:${m1_PASSWORD}@postgres:5432/m1
      SMTP_URL: smtp://mailpit:1025
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3100}
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DOCENTE_PASSWORD: ${SEED_DOCENTE_PASSWORD:-}
    command: ["sh", "-c", "node dist/migrate.js && node dist/main.js"]
    depends_on:
      postgres: {condition: service_healthy}
      mailpit: {condition: service_started}
  m2:
    <<: *service
    environment:
      SERVICE_NAME: m2
      DATABASE_URL: postgres://m2:${m2_PASSWORD}@postgres:5432/m2
volumes:
  a-postgres:
