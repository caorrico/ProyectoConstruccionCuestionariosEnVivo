name: cuestionarios-b
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      m3_PASSWORD: ${m3_PASSWORD:?Defina m3_PASSWORD}
      m4_PASSWORD: ${m4_PASSWORD:?Defina m4_PASSWORD}
      m5_PASSWORD: ${m5_PASSWORD:?Defina m5_PASSWORD}
    ports: ["127.0.0.1:5542:5432"]
    volumes:
      - b-postgres:/var/lib/postgresql/data
      - ./equipos/b/db/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  m3: &service
    build: ./equipos/b
    environment:
      SERVICE_NAME: m3
      DATABASE_URL: postgres://m3:${m3_PASSWORD}@postgres:5432/m3
    command: ["sh", "-c", "node dist/migrate.js && node dist/main.js"]
    depends_on:
      postgres: {condition: service_healthy}
  m4:
    <<: *service
    environment:
      SERVICE_NAME: m4
      DATABASE_URL: postgres://m4:${m4_PASSWORD}@postgres:5432/m4
  m5:
    <<: *service
    environment:
      SERVICE_NAME: m5
      DATABASE_URL: postgres://m5:${m5_PASSWORD}@postgres:5432/m5
  simulator-a:
    build: ./equipos/b/simulator
    environment:
      NODE_ENV: development
      ALLOW_DEV_SIMULATOR: "true"
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Defina SERVICE_TOKEN}
    ports: ["127.0.0.1:3201:3000"]
volumes:
  b-postgres:
