name: cuestionarios-identidad-prueba
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: m1
      POSTGRES_PASSWORD: solo_prueba_local
      POSTGRES_DB: m1
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U m1 -d m1"]
      interval: 3s
      timeout: 3s
      retries: 30
  m1:
    build: ./equipos/a/api
    environment:
      NODE_ENV: development
      SERVICE_NAME: m1
      DATABASE_URL: postgres://m1:solo_prueba_local@db:5432/m1
      SEED_DEMO: "true"
      SEED_ADMIN_PASSWORD: AdminLocal2026
      SEED_DOCENTE_PASSWORD: DocenteLocal2026
      JWT_ISSUER: http://localhost:3211
      JWT_AUDIENCE: cuestionarios-a,cuestionarios-b
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Defina SERVICE_TOKEN de al menos 32 caracteres}
      SMTP_URL: smtp://localhost:1025
      SMTP_SIN_TLS: "true"
    command: ["sh", "-c", "node dist/migrate.js && node dist/main.js"]
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:3211:3000"]
